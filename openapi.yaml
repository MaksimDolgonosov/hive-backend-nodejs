openapi: 3.0.3
info:
  title: Sting App API
  description: >
    API мобильного приложения «Улей»: публикация геолоцированных фото
    ("жал"), которые исчезают через 4 часа, и их кластеризация в «ульи».
  version: 0.1.0
  contact:
    name: Sting App backend team

servers:
  - url: https://api.sting-app.example.com/api/v1
    description: Production
  - url: https://staging-api.sting-app.example.com/api/v1
    description: Staging

tags:
  - name: auth
    description: Регистрация, вход, OTP, управление токенами
  - name: stings
    description: Публикация и просмотр жал
  - name: hives
    description: Просмотр ульев (кластеров жал)
  - name: places
    description: Карточки заведений
  - name: partner
    description: Самопубликация партнёра
  - name: zones
    description: Гео-зоны плотности и TTL
  - name: map
    description: Обзор карты на дальнем зуме
  - name: campaigns
    description: Час улья и событийные кампании
  - name: invites
    description: Инвайты и атрибуция
  - name: waitlist
    description: Гео-вейтлист
  - name: devices
    description: Push-устройства
  - name: notifications
    description: Настройки уведомлений
  - name: analytics
    description: События роста
  - name: admin
    description: Админ-эндпоинты роста

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------
  # AUTH
  # ---------------------------------------------------------------------
  /auth/register:
    post:
      tags: [auth]
      summary: Регистрация — создаёт pending-аккаунт и отправляет OTP на email
      description: >
        Токены не выдаются. После получения кода клиент вызывает `POST /auth/otp/verify`.
        Если email уже есть и не подтверждён — обновляются пароль/username и высылается новый код.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: OTP отправлен, требуется подтверждение email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpDispatchResponse'
        '409':
          description: Email уже подтверждён или username занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/OtpRateLimited'

  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Подтверждение OTP регистрации — активация аккаунта и выдача сессии
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Email подтверждён, выдана сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: OTP_INVALID / OTP_EXPIRED / OTP_MAX_ATTEMPTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Нет активного challenge (OTP_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/OtpRateLimited'

  /auth/otp/resend:
    post:
      tags: [auth]
      summary: Повторная отправка OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
      responses:
        '200':
          description: Код отправлен (или тот же ответ без письма — anti-enumeration для password_reset)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpDispatchResponse'
        '429':
          description: OTP_RESEND_COOLDOWN или OTP_RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [auth]
      summary: Вход по email и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email не подтверждён (EMAIL_NOT_VERIFIED) — клиент открывает экран OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/OtpRateLimited'

  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Запрос OTP для сброса пароля
      description: >
        Ответ всегда одинаковый, даже если email не найден или не подтверждён (anti-enumeration).
        Письмо уходит только существующему подтверждённому пользователю.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        '200':
          description: Унифицированный успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpDispatchResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/OtpRateLimited'

  /auth/password/reset:
    post:
      tags: [auth]
      summary: Сброс пароля по OTP (вариант A — один запрос)
      description: >
        При успехе пароль обновляется, все refresh-токены отзываются, выдаётся новая сессия.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Пароль изменён, выдана новая сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: OTP_INVALID / OTP_EXPIRED / OTP_MAX_ATTEMPTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Нет активного challenge (OTP_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/OtpRateLimited'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Обновление accessToken по refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'
        '401':
          description: refreshToken истёк или отозван — клиент обязан разлогинить пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход (отзыв refreshToken текущего устройства)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: Токен отозван

  /auth/me/stats:
    get:
      tags: [auth]
      summary: Активная статистика профиля
      description: Метрики по неистёкшим жала пользователя (окно TTL 4 часа).
      responses:
        '200':
          description: Статистика и превью последних фото
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me/awards:
    get:
      tags: [auth]
      summary: Награды текущего пользователя
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '200':
          description: Страница наград
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me/settings:
    patch:
      tags: [auth]
      summary: allowEcho и allowSharing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allowEcho: { type: boolean }
                allowSharing: { type: boolean }
      responses:
        '200':
          description: Настройки приватности
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me/stings:
    get:
      tags: [auth]
      summary: Опубликованные жала текущего пользователя
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Пагинированный список жал автора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StingsPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me/hives:
    get:
      tags: [auth]
      summary: Ульи, в которых есть фото текущего пользователя
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Пагинированный список ульев пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserHivesPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me/liked-stings:
    get:
      tags: [auth]
      summary: Жала, которые текущий пользователь лайкнул
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Пагинированный список лайкнутых жал
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StingsPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [auth]
      summary: Текущий авторизованный пользователь
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [auth]
      summary: Удаление аккаунта и связанных персональных данных
      description: |
        Удаляет текущего пользователя, его сессии, OTP-челленджи, аватар,
        опубликованные фото и реакции. Требуется для App Store Guideline 5.1.1(v).
      responses:
        '204':
          description: Аккаунт удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me/avatar:
    post:
      tags: [auth]
      summary: Загрузка или замена аватара
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: JPEG, максимум 2 МБ
      responses:
        '200':
          description: Аватар обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [auth]
      summary: Удаление аватара
      responses:
        '200':
          description: Аватар удалён
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------
  # STINGS
  # ---------------------------------------------------------------------
  /stings/nearby:
    get:
      tags: [stings]
      summary: Активные жала и ульи в видимой области карты
      parameters:
        - $ref: '#/components/parameters/SwLat'
        - $ref: '#/components/parameters/SwLng'
        - $ref: '#/components/parameters/NeLat'
        - $ref: '#/components/parameters/NeLng'
        - in: query
          name: includeEchoes
          schema: { type: boolean, default: false }
        - in: query
          name: includeSeeds
          schema: { type: boolean, default: false }
        - in: query
          name: includePlaces
          schema: { type: boolean, default: true }
          description: Live-места с обложкой в bbox, не больше 100, ближе к центру области
        - in: query
          name: minResults
          schema: { type: integer, minimum: 0, maximum: 50, default: 0 }
        - in: query
          name: maxRadiusM
          schema: { type: integer, minimum: 1, default: 50000 }
      responses:
        '200':
          description: Список жал и ульев в bounding box
          content:
            application/json:
              schema:
                type: object
                properties:
                  stings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sting'
                  hives:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hive'
                  places:
                    type: array
                    description: Есть, когда includePlaces=true
                    items:
                      $ref: '#/components/schemas/PlaceSummary'
                  echoes:
                    type: array
                    items:
                      type: object
                      properties:
                        cellId: { type: string }
                        center: { $ref: '#/components/schemas/GeoPoint' }
                        count: { type: integer }
                        lastSeenAt: { type: string, format: date-time }
                  appliedBounds:
                    $ref: '#/components/schemas/GeoPoint'
                  expanded:
                    type: boolean
                  appliedRadiusM:
                    type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /stings/nearest:
    get:
      tags: [stings]
      summary: Ближайшие активные жала
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number }
        - in: query
          name: lng
          required: true
          schema: { type: number }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 10, default: 1 }
      responses:
        '200':
          description: Ближайшие жала и дистанция в метрах
          content:
            application/json:
              schema:
                type: object
                properties:
                  stings:
                    type: array
                    items: { $ref: '#/components/schemas/Sting' }
                  distanceM:
                    type: number
                    nullable: true

  /stings:
    post:
      tags: [stings]
      summary: Публикация нового жала (только камера, multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo, lat, lng, accuracy, capturedAt]
              properties:
                photo:
                  type: string
                  format: binary
                  description: JPEG-файл, снятый камерой приложения
                lat:
                  type: number
                  format: double
                lng:
                  type: number
                  format: double
                accuracy:
                  type: number
                  format: float
                  description: Точность GPS в метрах на момент съёмки
                capturedAt:
                  type: string
                  format: date-time
                  description: Клиентский таймстамп момента съёмки
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            format: uuid
          description: >
            UUID, генерируемый клиентом при старте публикации — предотвращает
            дубликаты при повторной отправке из-за обрыва связи.
      responses:
        '201':
          description: Жало опубликовано
          content:
            application/json:
              schema:
                type: object
                properties:
                  sting:
                    $ref: '#/components/schemas/Sting'
                  ttlSec:
                    type: integer
                  zone:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, enum: [open, waitlist] }
                      ttlSec: { type: integer }
                  awards:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [zone_first, zone_revival, hive_ignited, hive_founder]
                        zoneId: { type: string }
                        createdAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Не пройдена серверная анти-спуфинг или NSFW-проверка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  summary: Анти-спуфинг
                  value:
                    error:
                      code: STING_VALIDATION_FAILED
                      message: Фото не прошло проверку подлинности
                      details:
                        reason: EXIF_MISMATCH
                moderationFailed:
                  summary: NSFW-модерация
                  value:
                    error:
                      code: CONTENT_MODERATION_FAILED
                      message: Фото не прошло проверку безопасности
        '429':
          description: Превышен лимит частоты публикаций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stings/{id}:
    get:
      tags: [stings]
      summary: Получить одно жало по id
      parameters:
        - $ref: '#/components/parameters/StingId'
      responses:
        '200':
          description: Жало найдено
          content:
            application/json:
              schema:
                type: object
                properties:
                  sting:
                    $ref: '#/components/schemas/Sting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Жало истекло и было удалено, либо не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [stings]
      summary: Удалить собственное жало до истечения TTL
      parameters:
        - $ref: '#/components/parameters/StingId'
      responses:
        '204':
          description: Жало удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Попытка удалить чужое жало
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Жало не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stings/{id}/reactions:
    post:
      tags: [stings]
      summary: Переключить реакцию like на жале
      parameters:
        - $ref: '#/components/parameters/StingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [like]
                  default: like
      responses:
        '200':
          description: Реакция переключена
          content:
            application/json:
              schema:
                type: object
                properties:
                  reactionsCount:
                    type: integer
                    example: 14
                  hasLiked:
                    type: boolean
                    example: true
                required: [reactionsCount, hasLiked]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Жало не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------
  # GROWTH
  # ---------------------------------------------------------------------
  /zones/current:
    get:
      tags: [zones]
      summary: Текущая зона и TTL до съёмки
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number }
        - in: query
          name: lng
          required: true
          schema: { type: number }
      responses:
        '200':
          description: Зона
          content:
            application/json:
              schema:
                type: object
                properties:
                  zone:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, enum: [open, waitlist] }
                      ttlSec: { type: integer }
                      activeStings: { type: integer }
                      isFirstEver: { type: boolean }
                      waitlistCount: { type: integer }
                      threshold: { type: integer }

  /map/overview:
    get:
      tags: [map]
      summary: Агрегаты карты на дальнем зуме
      parameters:
        - $ref: '#/components/parameters/SwLat'
        - $ref: '#/components/parameters/SwLng'
        - $ref: '#/components/parameters/NeLat'
        - $ref: '#/components/parameters/NeLng'
        - in: query
          name: zoom
          required: true
          schema: { type: number }
      responses:
        '200':
          description: Кластеры без фото отдельных жал

  /campaigns/active:
    get:
      tags: [campaigns]
      summary: Активные кампании в точке
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number }
        - in: query
          name: lng
          required: true
          schema: { type: number }
      responses:
        '200':
          description: Список кампаний

  /invites:
    post:
      tags: [invites]
      summary: Создать инвайт-код
      responses:
        '201':
          description: Код создан

  /invites/me:
    get:
      tags: [invites]
      summary: Инвайты текущего пользователя

  /invites/{code}:
    get:
      tags: [invites]
      security: []
      summary: Публичная проверка кода
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }

  /waitlist:
    post:
      tags: [waitlist]
      security: []
      summary: Заявка в гео-вейтлист
      responses:
        '404':
          description: FEATURE_DISABLED, если WAITLIST_ENABLED=false

  /devices:
    post:
      tags: [devices]
      summary: Зарегистрировать Expo push token
      responses:
        '204':
          description: Сохранено

  /devices/{deviceId}:
    delete:
      tags: [devices]
      summary: Удалить устройство
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Удалено

  /notifications/settings:
    get:
      tags: [notifications]
      summary: Настройки пушей
    patch:
      tags: [notifications]
      summary: Частичное обновление настроек пушей

  /analytics/events:
    post:
      tags: [analytics]
      security: []
      summary: Батч клиентских событий роста

  /admin/campaigns:
    post:
      tags: [admin]
      summary: Создать кампанию (роль admin)

  /admin/users/{id}/account-type:
    post:
      tags: [admin]
      summary: Сменить accountType пользователя

  /admin/metrics/density:
    get:
      tags: [admin]
      summary: Метрики плотности зоны

  /admin/metrics/retention:
    get:
      tags: [admin]
      summary: Retention по зоне первой сессии

  /admin/metrics/growth:
    get:
      tags: [admin]
      summary: kFactor и виральные метрики

  /admin/places:
    post:
      tags: [admin]
      summary: Создать official-место без заявки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId, name, category, center]
              properties:
                ownerId: { type: string }
                name: { type: string, minLength: 2, maxLength: 80 }
                category: { type: string, enum: [cafe, bar, restaurant, other] }
                description: { type: string, nullable: true, maxLength: 280 }
                phone: { type: string, nullable: true }
                address:
                  type: object
                  properties:
                    formatted: { type: string, maxLength: 200 }
                    city: { type: string, nullable: true, maxLength: 80 }
                    country: { type: string, nullable: true, maxLength: 80 }
                center: { $ref: '#/components/schemas/GeoPoint' }
      responses:
        '201':
          description: Место создано
          content:
            application/json:
              schema:
                type: object
                required: [place]
                properties:
                  place: { $ref: '#/components/schemas/Place' }
        '409':
          description: PLACE_OVERLAP
        '422':
          description: PLACE_LIMIT или NOT_PARTNER, если владелец не official

  /admin/places/{id}/suspend:
    post:
      tags: [admin]
      summary: Снять место
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200':
          description: Место suspended
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [suspended] }

  /admin/places/{id}/unsuspend:
    post:
      tags: [admin]
      summary: Снять suspend. Место остаётся paused
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Статус paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [paused] }

  /admin/places/{id}/transfer:
    post:
      tags: [admin]
      summary: Передать место другому заведению
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newOwnerId]
              properties:
                newOwnerId: { type: string }
      responses:
        '200':
          description: Новый владелец
          content:
            application/json:
              schema:
                type: object
                properties:
                  ownerId: { type: string }
        '422':
          description: NOT_PARTNER, если один из аккаунтов не заведение

  /admin/places/{id}/center:
    post:
      tags: [admin]
      summary: Сдвинуть центр места
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Новый центр
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoPoint' }

  /admin/place-media/{id}/review:
    post:
      tags: [admin]
      summary: Отклонить кадр места
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: id PlaceMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [reject] }
                rejectCode:
                  type: string
                  enum: [quality, not_this_place, people_sensitive, stolen, other]
      responses:
        '200':
          description: Кадр rejected. Обложка live-места уводит место в paused с pauseReason=cover_missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  moderation: { type: string, enum: [rejected] }
                  rejectCode:
                    type: string
                    enum: [quality, not_this_place, people_sensitive, stolen, other]

  /admin/place-reports/{id}/resolve:
    post:
      tags: [admin]
      summary: Принять или закрыть жалобу на место
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accept, dismiss] }
      responses:
        '200':
          description: Жалоба закрыта
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [accepted, dismissed] }

  # ---------------------------------------------------------------------
  # HIVES
  # ---------------------------------------------------------------------
  /hives/{id}:
    get:
      tags: [hives]
      summary: Улей и список жал в нём
      parameters:
        - $ref: '#/components/parameters/HiveId'
      responses:
        '200':
          description: Улей найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  hive:
                    $ref: '#/components/schemas/Hive'
                  stings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Улей не найден (растворился — не осталось активных жал)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hives/{id}/stings:
    get:
      tags: [hives]
      summary: Пагинированный список жал в улье
      parameters:
        - $ref: '#/components/parameters/HiveId'
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Страница жал улья
          content:
            application/json:
              schema:
                type: object
                properties:
                  stings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sting'
                  nextCursor:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'


  /places/me:
    get:
      tags: [places]
      summary: Места текущего владельца
      responses:
        '200':
          description: Список мест владельца, включая draft, paused и suspended
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/Place' }

  /places/{id}:
    get:
      tags: [places]
      summary: Карточка места
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: >
            Полный объект для владельца. Чужой paused урезан и hidden=true.
            Телефон и pauseReason видит только владелец. verifiedAt в ответе null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceView' }
        '404':
          description: Нет места, чужой draft или чужой suspended (PLACE_SUSPENDED)
    patch:
      tags: [places]
      summary: Правка карточки. Центр и радиус не меняются
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceUpdate' }
      responses:
        '200':
          description: Обновлённое место
          content:
            application/json:
              schema:
                type: object
                required: [place]
                properties:
                  place: { $ref: '#/components/schemas/Place' }
        '403':
          description: MEDIA_NOT_OWNER или PLACE_SUSPENDED
    delete:
      tags: [places]
      summary: Удалить черновик вместе с его медиа
      description: Live и paused этим методом не удаляются. Их убирает POST /places/{id}/pause.
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '204':
          description: Черновик удалён
        '422':
          description: PLACE_NOT_DRAFT

  /places/{id}/stings:
    get:
      tags: [places]
      summary: Активные жала, привязанные к месту
      parameters:
        - $ref: '#/components/parameters/PlaceId'
        - in: query
          name: includePartner
          schema: { type: boolean, default: false }
          description: По умолчанию только жала personal
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Страница жал. У скрытого места массив пустой
          content:
            application/json:
              schema:
                type: object
                properties:
                  stings:
                    type: array
                    items: { $ref: '#/components/schemas/Sting' }
                  nextCursor: { type: string, nullable: true }
        '422':
          description: INVALID_CURSOR

  /places/{id}/media:
    post:
      tags: [places]
      summary: Обложка или кадр галереи. Сразу approved
      description: >
        Поле называется kind, не role. Обложка у draft переводит место в live и отвечает wentLive=true.
        kind=gallery сервер принимает, не больше 12 кадров.
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo, kind, source]
              properties:
                photo: { type: string, format: binary }
                kind: { type: string, enum: [cover, gallery] }
                source: { type: string, enum: [library, camera] }
      responses:
        '201':
          description: Медиа принято
          content:
            application/json:
              schema:
                type: object
                required: [place, wentLive]
                properties:
                  place: { $ref: '#/components/schemas/Place' }
                  wentLive: { type: boolean }
        '403':
          description: NOT_PARTNER, MEDIA_NOT_OWNER или PLACE_SUSPENDED
        '422':
          description: MEDIA_TOO_SMALL, MEDIA_LIMIT или VALIDATION_ERROR, если нет photo

  /places/{id}/media/order:
    patch:
      tags: [places]
      summary: Порядок галереи
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [galleryIds]
              properties:
                galleryIds:
                  type: array
                  maxItems: 12
                  items: { type: string }
                  description: Все id кадров kind=gallery этого места, в новом порядке
      responses:
        '200':
          description: Порядок сохранён
          content:
            application/json:
              schema:
                type: object
                required: [place]
                properties:
                  place: { $ref: '#/components/schemas/Place' }
        '422':
          description: VALIDATION_ERROR, если список не совпадает с текущей галереей

  /places/{id}/media/{mediaId}:
    delete:
      tags: [places]
      summary: Удалить кадр места
      description: Удаление обложки у live-места ставит paused, pauseReason=cover_missing и снимает Hive.placeId.
      parameters:
        - $ref: '#/components/parameters/PlaceId'
        - $ref: '#/components/parameters/PlaceMediaId'
      responses:
        '200':
          description: Кадр удалён
          content:
            application/json:
              schema:
                type: object
                required: [place]
                properties:
                  place: { $ref: '#/components/schemas/Place' }
        '404':
          description: Фото не найдено

  /places/{id}/pause:
    post:
      tags: [places]
      summary: Скрыть live-место с карты
      description: Статус paused, pauseReason=owner. Hive.placeId этого места обнуляется.
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Место paused
          content:
            application/json:
              schema:
                type: object
                required: [place]
                properties:
                  place: { $ref: '#/components/schemas/Place' }
        '422':
          description: PLACE_NOT_LIVE

  /places/{id}/resume:
    post:
      tags: [places]
      summary: Вернуть скрытое место. Нужна обложка
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Место live
          content:
            application/json:
              schema:
                type: object
                required: [place]
                properties:
                  place: { $ref: '#/components/schemas/Place' }
        '403':
          description: NOT_PARTNER
        '422':
          description: PLACE_RESUME_NEEDS_COVER или VALIDATION_ERROR, если статус не paused

  /places/{id}/reports:
    post:
      tags: [places]
      summary: Жалоба на место
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceReportRequest' }
      responses:
        '201':
          description: Жалоба принята
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        '422':
          description: VALIDATION_ERROR, владелец не может жаловаться на своё место

  /places/{id}/media/{mediaId}/reports:
    post:
      tags: [places]
      summary: Жалоба на кадр места
      parameters:
        - $ref: '#/components/parameters/PlaceId'
        - $ref: '#/components/parameters/PlaceMediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceReportRequest' }
      responses:
        '201':
          description: Жалоба принята
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        '404':
          description: Место или кадр не найдены

  /partner/applications:
    post:
      tags: [partner]
      summary: Черновик заявки. Повторный вызов обновляет уже открытый draft и тоже отвечает 201
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerApplicationWrite' }
      responses:
        '201':
          description: Draft создан или обновлён
          content:
            application/json:
              schema:
                type: object
                required: [application]
                properties:
                  application: { $ref: '#/components/schemas/PartnerApplication' }
        '422':
          description: PLACE_LIMIT, если уже заняты три места live, paused или suspended

  /partner/applications/me:
    get:
      tags: [partner]
      summary: Заявки текущего пользователя
      responses:
        '200':
          description: До 20 заявок
          content:
            application/json:
              schema:
                type: object
                required: [applications]
                properties:
                  applications:
                    type: array
                    items: { $ref: '#/components/schemas/PartnerApplication' }

  /partner/applications/{id}:
    patch:
      tags: [partner]
      summary: Правка черновика заявки
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerApplicationWrite' }
      responses:
        '200':
          description: Черновик обновлён
          content:
            application/json:
              schema:
                type: object
                required: [application]
                properties:
                  application: { $ref: '#/components/schemas/PartnerApplication' }
        '422':
          description: APPLICATION_NOT_EDITABLE

  /partner/applications/{id}/onsite:
    post:
      tags: [partner]
      summary: Кадр фасада с камеры. Путь публикации его не требует и не создаёт жало
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo, lat, lng, accuracy, capturedAt]
              properties:
                photo: { type: string, format: binary }
                lat: { type: number }
                lng: { type: number }
                accuracy: { type: number, minimum: 0 }
                capturedAt: { type: string, format: date-time }
      responses:
        '200':
          description: On-site записан. Сам кадр в JSON не отдаётся
          content:
            application/json:
              schema:
                type: object
                required: [application]
                properties:
                  application: { $ref: '#/components/schemas/PartnerApplication' }
        '422':
          description: >
            ONSITE_LOW_ACCURACY, если accuracy хуже 50 м.
            ONSITE_VALIDATION_FAILED, в том числе details.reason=GALLERY_SOURCE.

  /partner/applications/{id}/submit:
    post:
      tags: [partner]
      summary: Публикует заявку и создаёт Place в draft
      description: >
        Центр места — lat/lng из тела, source=declared. Текстовый адрес не обязателен.
        Нужны название, категория, email и точка. accountType становится partner.
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Заявка published, место в draft до загрузки обложки
          content:
            application/json:
              schema:
                type: object
                required: [application, placeId]
                properties:
                  application: { $ref: '#/components/schemas/PartnerApplication' }
                  placeId: { type: string }
        '409':
          description: PLACE_OVERLAP, чужое live или draft ближе 40 м
        '422':
          description: APPLICATION_INCOMPLETE, в details.missing список пустых полей

  /share/places/{id}:
    servers:
      - url: https://api.sting-app.example.com
        description: Корень без префикса /api/v1
    get:
      tags: [places]
      security: []
      summary: OG-страница live-места с обложкой
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: HTML
        '404':
          description: Место не live или без обложки


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    StingId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    HiveId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    PlaceId:
      in: path
      name: id
      required: true
      schema:
        type: string
        description: Mongo id
    PlaceMediaId:
      in: path
      name: mediaId
      required: true
      schema:
        type: string
    SwLat:
      in: query
      name: swLat
      required: true
      schema:
        type: number
        format: double
      description: Широта юго-западного угла видимой области карты
    SwLng:
      in: query
      name: swLng
      required: true
      schema:
        type: number
        format: double
      description: Долгота юго-западного угла видимой области карты
    NeLat:
      in: query
      name: neLat
      required: true
      schema:
        type: number
        format: double
      description: Широта северо-восточного угла видимой области карты
    NeLng:
      in: query
      name: neLng
      required: true
      schema:
        type: number
        format: double
      description: Долгота северо-восточного угла видимой области карты

  responses:
    Unauthorized:
      description: Отсутствует или недействителен accessToken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OtpRateLimited:
      description: Превышен лимит запросов OTP/auth
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, username, avatarUrl, createdAt]

    ProfileStats:
      type: object
      properties:
        photos:
          type: integer
          description: Активные опубликованные жала пользователя
        hives:
          type: integer
          description: Уникальные улья с участием фото пользователя
        likes:
          type: integer
          description: Сумма reactionsCount на активных жала пользователя
      required: [photos, hives, likes]

    ProfileOverview:
      type: object
      properties:
        stats:
          $ref: '#/components/schemas/ProfileStats'
        recentPhotos:
          type: array
          items:
            type: string
            format: uri
          description: До 4 thumbnailUrl последних активных жала
      required: [stats, recentPhotos]

    StingsPage:
      type: object
      properties:
        stings:
          type: array
          items:
            $ref: '#/components/schemas/Sting'
        nextCursor:
          type: string
          nullable: true
      required: [stings, nextCursor]

    UserHiveSummary:
      allOf:
        - $ref: '#/components/schemas/Hive'
        - type: object
          properties:
            userStingsCount:
              type: integer
              description: Число активных жал пользователя в этом улье
          required: [userStingsCount]

    UserHivesPage:
      type: object
      properties:
        hives:
          type: array
          items:
            $ref: '#/components/schemas/UserHiveSummary'
        nextCursor:
          type: string
          nullable: true
      required: [hives, nextCursor]

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT, TTL ~15 минут
        refreshToken:
          type: string
          description: TTL ~30 дней
        expiresAt:
          type: string
          format: date-time
          description: Срок действия accessToken
      required: [accessToken, refreshToken, expiresAt]

    AuthSessionResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
      required: [user, tokens]

    OtpDispatchResponse:
      type: object
      properties:
        status:
          type: string
          enum: [otp_required, otp_sent]
        email:
          type: string
          format: email
        purpose:
          type: string
          enum: [register, password_reset]
        expiresInSec:
          type: integer
          example: 600
        resendAvailableInSec:
          type: integer
          example: 60
      required: [status, email, purpose, expiresInSec, resendAvailableInSec]

    OtpVerifyRequest:
      type: object
      required: [email, code, purpose]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
          example: '123456'
        purpose:
          type: string
          enum: [register]

    OtpResendRequest:
      type: object
      required: [email, purpose]
      properties:
        email:
          type: string
          format: email
        purpose:
          type: string
          enum: [register, password_reset]
        locale:
          type: string
          enum: [ru, en]

    PasswordForgotRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        locale:
          type: string
          enum: [ru, en]

    PasswordResetRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
        newPassword:
          type: string
          format: password
          minLength: 8

    RegisterRequest:
      type: object
      required: [email, password, username]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        username:
          type: string
          minLength: 3
          maxLength: 30

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    GeoPoint:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
      required: [lat, lng]

    Sting:
      type: object
      properties:
        id:
          type: string
        authorId:
          type: string
        authorUsername:
          type: string
        authorAvatarUrl:
          type: string
          nullable: true
        authorAccountType:
          type: string
          enum: [personal, partner, official]
        imageUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        location:
          $ref: '#/components/schemas/GeoPoint'
        hiveId:
          type: string
          nullable: true
        placeId:
          type: string
          nullable: true
          description: Live-место, в радиус которого попало жало
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        reactionsCount:
          type: integer
        comment:
          type: string
          nullable: true
        shareUrl:
          type: string
          nullable: true
        hasLiked:
          type: boolean
      required:
        - id
        - authorId
        - imageUrl
        - thumbnailUrl
        - location
        - hiveId
        - placeId
        - createdAt
        - expiresAt
        - reactionsCount
        - shareUrl

    Hive:
      type: object
      properties:
        id:
          type: string
        center:
          $ref: '#/components/schemas/GeoPoint'
        radiusM:
          type: number
        activeStingsCount:
          type: integer
        activationCount:
          type: integer
        contributorsCount:
          type: integer
        stage:
          type: string
          enum: [seed, hive]
        placeId:
          type: string
          nullable: true
        place:
          nullable: true
          description: Summary live-места, если центр соты или улья внутри его радиуса
          allOf:
            - $ref: '#/components/schemas/PlaceSummary'
        topContributors:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              username: { type: string }
              avatarUrl: { type: string, nullable: true }
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - center
        - radiusM
        - activeStingsCount
        - activationCount
        - contributorsCount
        - stage
        - createdAt
        - updatedAt


    SocialLinks:
      type: object
      properties:
        instagram: { type: string, nullable: true }
        telegram: { type: string, nullable: true }
        tiktok: { type: string, nullable: true }
        youtube: { type: string, nullable: true }
        website: { type: string, nullable: true }
      required: [instagram, telegram, tiktok, youtube, website]

    PlaceMedia:
      type: object
      properties:
        id: { type: string }
        placeId: { type: string }
        kind: { type: string, enum: [cover, gallery] }
        source: { type: string, enum: [library, camera] }
        imageUrl: { type: string }
        thumbnailUrl: { type: string }
        width: { type: integer }
        height: { type: integer }
        sortOrder: { type: integer }
        moderation: { type: string, enum: [approved, rejected] }
        rejectCode:
          type: string
          nullable: true
          enum: [quality, not_this_place, people_sensitive, stolen, other]
        createdAt: { type: string, format: date-time }
      required: [id, placeId, kind, source, imageUrl, thumbnailUrl, moderation, createdAt]

    PlaceSummary:
      type: object
      description: Пин live-места с обложкой. Телефона, EXIF и on-site кадра нет.
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, enum: [cafe, bar, restaurant, other] }
        coverThumbnailUrl: { type: string, nullable: true }
        center: { $ref: '#/components/schemas/GeoPoint' }
        radiusM: { type: number }
        hiveId: { type: string, nullable: true }
        hiveStage: { type: string, nullable: true, enum: [seed, hive] }
        activeGuestStingsCount: { type: integer }
        status: { type: string, enum: [live] }
      required: [id, name, category, coverThumbnailUrl, center, radiusM, hiveId, hiveStage, activeGuestStingsCount, status]

    Place:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true, maxLength: 280 }
        category: { type: string, enum: [cafe, bar, restaurant, other] }
        status: { type: string, enum: [draft, live, paused, suspended] }
        pauseReason:
          type: string
          nullable: true
          enum: [owner, cover_missing, reports]
          description: Чужому зрителю всегда null
        address:
          type: object
          properties:
            formatted: { type: string }
            city: { type: string, nullable: true }
            country: { type: string, nullable: true }
          required: [formatted, city, country]
        center: { $ref: '#/components/schemas/GeoPoint' }
        radiusM: { type: number }
        cover:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PlaceMedia'
        gallery:
          type: array
          items: { $ref: '#/components/schemas/PlaceMedia' }
        socialLinks: { $ref: '#/components/schemas/SocialLinks' }
        hiveId: { type: string, nullable: true }
        hiveStage: { type: string, nullable: true, enum: [seed, hive] }
        activeGuestStingsCount: { type: integer }
        verifiedAt: { type: string, format: date-time, nullable: true }
        phone:
          type: string
          nullable: true
          description: Только владелец. В чужом ответе null
        hidden: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, ownerId, name, category, status, center, radiusM, cover, gallery, socialLinks, hidden]

    PlaceView:
      type: object
      required: [place, viewerIsOwner]
      properties:
        place: { $ref: '#/components/schemas/Place' }
        viewerIsOwner: { type: boolean }

    PlaceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, nullable: true, maxLength: 280 }
        category: { type: string, enum: [cafe, bar, restaurant, other] }
        phone: { type: string, nullable: true }
        address:
          type: object
          properties:
            formatted: { type: string, nullable: true, maxLength: 200 }
            city: { type: string, nullable: true, maxLength: 80 }
            country: { type: string, nullable: true, maxLength: 80 }
        socialLinks:
          type: object
          nullable: true
          description: Пустая строка стирает ключ. @username разворачивается в URL
          properties:
            instagram: { type: string, nullable: true }
            telegram: { type: string, nullable: true }
            tiktok: { type: string, nullable: true }
            youtube: { type: string, nullable: true }
            website: { type: string, nullable: true }

    PlaceReportRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [not_a_place, wrong_location, stolen_photos, spam, other] }
        comment: { type: string, maxLength: 500 }

    PartnerApplication:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        brandName: { type: string }
        category: { type: string, enum: [cafe, bar, restaurant, other] }
        address:
          type: object
          properties:
            formatted: { type: string }
            city: { type: string, nullable: true }
            country: { type: string, nullable: true }
            lat: { type: number, nullable: true }
            lng: { type: number, nullable: true }
            source: { type: string, enum: [declared, onsite, manual_admin] }
        phone: { type: string, nullable: true }
        contactEmail: { type: string }
        listingUrls:
          type: object
          properties:
            instagram: { type: string, nullable: true }
            website: { type: string, nullable: true }
            ymaps: { type: string, nullable: true }
            twogis: { type: string, nullable: true }
        onsite:
          nullable: true
          type: object
          properties:
            verifiedAt: { type: string, format: date-time }
            lat: { type: number }
            lng: { type: number }
            accuracyM: { type: number }
            distanceToAddressM: { type: number }
        status: { type: string, enum: [draft, published] }
        placeId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time, nullable: true }
      required: [id, userId, brandName, category, status, placeId]

    PartnerApplicationWrite:
      type: object
      properties:
        brandName: { type: string, minLength: 2, maxLength: 80 }
        category: { type: string, enum: [cafe, bar, restaurant, other] }
        phone: { type: string, nullable: true }
        contactEmail: { type: string, format: email }
        address:
          type: object
          properties:
            formatted: { type: string, nullable: true, maxLength: 200 }
            city: { type: string, nullable: true, maxLength: 80 }
            country: { type: string, nullable: true, maxLength: 80 }
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        listingUrls:
          type: object
          properties:
            instagram: { type: string, nullable: true, maxLength: 300 }
            website: { type: string, nullable: true, maxLength: 300 }
            ymaps: { type: string, nullable: true, maxLength: 300 }
            twogis: { type: string, nullable: true, maxLength: 300 }


    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: STING_LOCATION_MISMATCH
            message:
              type: string
              example: Координаты фото не совпадают с текущим местоположением
            details:
              type: object
              additionalProperties: true
          required: [code, message]
      required: [error]
